<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>海外志工幹部生存戰 | Overseas Volunteer Leader Survival</title>
    <style>
        :root {
            --bg-color: #f4f7f6;
            --primary-color: #2c3e50;
            --card-bg: #ffffff;
            --text-main: #333333;
            --text-muted: #666666;
            --swipe-up: #3498db;
            --swipe-down: #e74c3c;
            --swipe-left: #f39c12;
            --swipe-right: #2ecc71;
        }

        body {
            margin: 0;
            padding: 0;
            background-color: var(--bg-color);
            font-family: 'Helvetica Neue', Arial, 'LiHei Pro', sans-serif;
            color: var(--text-main);
        }

        #app {
            display: flex;
            flex-direction: column;
            height: 100dvh;
            max-width: 500px;
            margin: 0 auto;
            background-color: var(--bg-color);
            position: relative;
        }

        .screen {
            flex: 1;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 20px;
            text-align: center;
            box-sizing: border-box;
        }

        .screen h1 { font-size: 24px; color: var(--primary-color); margin-bottom: 10px; }
        .screen p { font-size: 15px; color: var(--text-muted); line-height: 1.6; margin-bottom: 30px; text-align: left; }
        
        .btn {
            background-color: var(--primary-color);
            color: white;
            border: none;
            padding: 15px 40px;
            font-size: 18px;
            border-radius: 30px;
            cursor: pointer;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            width: 80%;
            margin-bottom: 15px;
        }

        /* 遊戲畫面 */
        #game-screen { display: none; flex-direction: column; height: 100%; padding: 15px; box-sizing: border-box; }
        #progress { text-align: center; font-weight: bold; color: var(--text-muted); margin-bottom: 15px; }

        #card-container { flex: 1; position: relative; z-index: 10; margin-bottom: 15px; min-height: 200px; }
        .card {
            position: absolute; top: 0; left: 0; right: 0; bottom: 0;
            background: var(--card-bg); border-radius: 15px; padding: 20px;
            box-shadow: 0 8px 15px rgba(0,0,0,0.1); overflow-y: auto; -webkit-overflow-scrolling: touch;
            transition: transform 0.3s ease, opacity 0.3s ease;
        }

        .scenario-title { font-size: 19px; font-weight: bold; color: var(--primary-color); margin-bottom: 15px; border-bottom: 2px solid #eee; padding-bottom: 8px; }
        .scenario-text { font-size: 15px; line-height: 1.6; }

        /* 選項區 */
        #swipe-zone { position: relative; background: rgba(255, 255, 255, 0.5); border-radius: 15px; padding: 10px; touch-action: none; }
        .swipe-hint { text-align: center; font-size: 12px; color: #888; margin-bottom: 8px; }
        .options-grid { display: grid; grid-template-columns: 1fr 1fr; grid-template-rows: auto auto; gap: 10px; }

        .opt {
            font-size: 13px; padding: 12px 10px; border-radius: 10px; line-height: 1.4;
            display: flex; align-items: center; color: white; font-weight: bold; cursor: pointer;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }
        .opt:active { transform: scale(0.95); }
        .opt.up { background-color: var(--swipe-up); grid-column: 1 / 3; justify-content: center;}
        .opt.left { background-color: var(--swipe-left); }
        .opt.right { background-color: var(--swipe-right); }
        .opt.down { background-color: var(--swipe-down); grid-column: 1 / 3; justify-content: center;}

        #swipe-overlay {
            position: absolute; top: 0; left: 0; right: 0; bottom: 0;
            display: flex; justify-content: center; align-items: center;
            font-size: 50px; font-weight: bold; color: white; opacity: 0;
            pointer-events: none; border-radius: 15px; transition: opacity 0.2s; z-index: 20;
        }

        /* 詳解畫面 */
        #explanation-screen { display: none; flex-direction: column; height: 100%; padding: 20px; background: var(--card-bg); box-sizing: border-box; overflow-y: auto; }
        .exp-title { font-size: 20px; font-weight: bold; color: var(--primary-color); margin-bottom: 15px; text-align: center;}
        .exp-score-box { background: #f8f9fa; border-left: 4px solid var(--primary-color); padding: 15px; margin-bottom: 20px; border-radius: 0 10px 10px 0;}
        .exp-score-item { font-size: 14px; margin-bottom: 8px; line-height: 1.4; }
        .exp-my-choice { font-weight: bold; color: #e74c3c; font-size: 16px; margin-bottom: 15px; border-bottom: 1px dashed #ccc; padding-bottom: 10px;}
        .exp-text { font-size: 15px; line-height: 1.6; color: var(--text-main); margin-bottom: 30px;}
        
        #final-score { font-size: 48px; color: var(--primary-color); font-weight: bold; margin: 10px 0; }
        #final-title { font-size: 22px; font-weight: bold; margin-bottom: 10px; }
        #final-desc { font-size: 15px; color: var(--text-muted); padding: 0 10px; text-align: left; line-height: 1.6;}

    </style>
</head>
<body>

<div id="app">
    <!-- 語言選擇頁 -->
    <div id="language-screen" class="screen">
        <h1>語言 / Language</h1>
        <p style="text-align: center; margin-bottom: 40px;">請選擇您要使用的語言<br>Please select your language</p>
        <button class="btn" onclick="setLanguage('zh')">繁體中文</button>
        <button class="btn" onclick="setLanguage('en')">English</button>
    </div>

    <!-- 首頁 -->
    <div id="start-screen" class="screen" style="display:none;">
        <h1 id="ui-title">載入中...</h1>
        <p id="ui-desc">載入中...</p>
        <button class="btn" id="ui-start-btn" onclick="startGame()">開始</button>
    </div>

    <!-- 遊戲頁 -->
    <div id="game-screen">
        <div id="progress">1 / 8</div>
        <div id="card-container">
            <div id="question-card" class="card">
                <div class="scenario-title" id="q-title"></div>
                <div class="scenario-text" id="q-text"></div>
            </div>
        </div>
        <div id="swipe-zone">
            <div class="swipe-hint" id="ui-hint">💡 點擊選項或在方塊區滑動</div>
            <div class="options-grid">
                <div class="opt up" id="opt-up" onclick="handleAnswer('up')">👆 </div>
                <div class="opt left" id="opt-left" onclick="handleAnswer('left')">👈 </div>
                <div class="opt right" id="opt-right" onclick="handleAnswer('right')">👉 </div>
                <div class="opt down" id="opt-down" onclick="handleAnswer('down')">👇 </div>
            </div>
            <div id="swipe-overlay"></div>
        </div>
    </div>

    <!-- 詳解頁 -->
    <div id="explanation-screen">
        <div class="exp-title" id="ui-exp-title">決策解析</div>
        <div class="exp-score-box">
            <div class="exp-my-choice" id="exp-my-choice"></div>
            <div class="exp-score-item" id="exp-s-up"></div>
            <div class="exp-score-item" id="exp-s-down"></div>
            <div class="exp-score-item" id="exp-s-left"></div>
            <div class="exp-score-item" id="exp-s-right"></div>
        </div>
        <div class="exp-text" id="exp-content"></div>
        <div style="text-align: center;">
            <button class="btn" id="ui-next-btn" onclick="nextQuestion()">下一題</button>
        </div>
    </div>

    <!-- 結算頁 -->
    <div id="end-screen" class="screen" style="display:none;">
        <h1 id="ui-end-title">評估結果</h1>
        <div id="final-score">0</div>
        <div id="final-title"></div>
        <p id="final-desc"></p>
        <button class="btn" id="ui-retry-btn" onclick="location.reload()">重新挑戰</button>
    </div>
</div>

    let currentLang = 'zh';
    let currentQ = 0;
    let totalScore = 0;
    let selectedScore = 0;

    const languageScreen = document.getElementById('language-screen');
    const startScreen = document.getElementById('start-screen');
    const gameScreen = document.getElementById('game-screen');
    const explanationScreen = document.getElementById('explanation-screen');
    const endScreen = document.getElementById('end-screen');
    
    function setLanguage(lang) {
        currentLang = lang;
        const dict = i18n[lang].ui;
        
        document.getElementById('ui-title').innerText = dict.title;
        document.getElementById('ui-desc').innerHTML = dict.desc;
        document.getElementById('ui-start-btn').innerText = dict.startBtn;
        document.getElementById('ui-hint').innerText = dict.hint;
        document.getElementById('ui-exp-title').innerText = dict.expTitle;
        document.getElementById('ui-next-btn').innerText = dict.nextBtn;
        document.getElementById('ui-end-title').innerText = dict.endTitle;
        document.getElementById('ui-retry-btn').innerText = dict.retryBtn;
        
        languageScreen.style.display = 'none';
        startScreen.style.display = 'flex';
    }

    function startGame() {
        startScreen.style.display = 'none';
        gameScreen.style.display = 'flex';
        currentQ = 0;
        totalScore = 0;
        loadQuestion();
    }

    function loadQuestion() {
        const questions = i18n[currentLang].questions;
        if (currentQ >= questions.length) {
            endGame();
            return;
        }
        
        const card = document.getElementById('question-card');
        const overlay = document.getElementById('swipe-overlay');
        card.style.transform = 'translate(0, 0)';
        card.style.opacity = '1';
        overlay.style.opacity = '0';
        
        const q = questions[currentQ];
        let qPrefix = currentLang === 'zh' ? `第 ${currentQ + 1} / ${questions.length} 題` : `Question ${currentQ + 1} / ${questions.length}`;
        document.getElementById('progress').innerText = qPrefix;
        document.getElementById('q-title').innerText = q.title;
        document.getElementById('q-text').innerText = q.text;
        
        document.getElementById('opt-up').innerText = `👆 ${q.options.up.text}`;
        document.getElementById('opt-down').innerText = `👇 ${q.options.down.text}`;
        document.getElementById('opt-left').innerText = `👈 ${q.options.left.text}`;
        document.getElementById('opt-right').innerText = `👉 ${q.options.right.text}`;
    }

    function handleAnswer(direction) {
        const q = i18n[currentLang].questions[currentQ];
        let choiceText = "";
        const card = document.getElementById('question-card');
        const overlay = document.getElementById('swipe-overlay');
        
        if(direction === 'up') { selectedScore = q.options.up.score; choiceText = q.options.up.text; card.style.transform = 'translateY(-150%)'; overlay.style.backgroundColor = 'rgba(52, 152, 219, 0.9)'; overlay.innerText = '👆'; }
        if(direction === 'down') { selectedScore = q.options.down.score; choiceText = q.options.down.text; card.style.transform = 'translateY(150%)'; overlay.style.backgroundColor = 'rgba(231, 76, 60, 0.9)'; overlay.innerText = '👇';}
        if(direction === 'left') { selectedScore = q.options.left.score; choiceText = q.options.left.text; card.style.transform = 'translateX(-150%)'; overlay.style.backgroundColor = 'rgba(243, 156, 18, 0.9)'; overlay.innerText = '👈';}
        if(direction === 'right') { selectedScore = q.options.right.score; choiceText = q.options.right.text; card.style.transform = 'translateX(150%)'; overlay.style.backgroundColor = 'rgba(46, 204, 113, 0.9)'; overlay.innerText = '👉';}

        overlay.style.opacity = '1';
        card.style.opacity = '0';
        totalScore += selectedScore;
        
        const dict = i18n[currentLang].ui;
        document.getElementById('exp-my-choice').innerText = `${dict.yourChoice}：${choiceText} (+${selectedScore} ${dict.pts})`;
        document.getElementById('exp-s-up').innerText = `👆 ${q.options.up.score} ${dict.pts}：${q.options.up.text}`;
        document.getElementById('exp-s-down').innerText = `👇 ${q.options.down.score} ${dict.pts}：${q.options.down.text}`;
        document.getElementById('exp-s-left').innerText = `👈 ${q.options.left.score} ${dict.pts}：${q.options.left.text}`;
        document.getElementById('exp-s-right').innerText = `👉 ${q.options.right.score} ${dict.pts}：${q.options.right.text}`;
        document.getElementById('exp-content').innerText = q.explanation;
        
        setTimeout(() => {
            gameScreen.style.display = 'none';
            explanationScreen.style.display = 'flex';
        }, 300);
    }

    function nextQuestion() {
        explanationScreen.style.display = 'none';
        gameScreen.style.display = 'flex';
        currentQ++;
        loadQuestion();
    }

    function endGame() {
        gameScreen.style.display = 'none';
        explanationScreen.style.display = 'none';
        endScreen.style.display = 'flex';
        
        const dict = i18n[currentLang].ui;
        document.getElementById('final-score').innerText = totalScore + " " + dict.pts;
        
        const results = i18n[currentLang].results;
        let finalTitle = results[3].title;
        let finalDesc = results[3].desc;
        
        for (let i = 0; i < results.length; i++) {
            if (totalScore >= results[i].min) {
                finalTitle = results[i].title;
                finalDesc = results[i].desc;
                break;
            }
        }
        
        document.getElementById('final-title').innerText = finalTitle;
        document.getElementById('final-desc').innerText = finalDesc;
    }

    // 觸控邏輯
    const swipeZone = document.getElementById('swipe-zone');
    let startX = 0;
    let startY = 0;
    const threshold = 40; 

    swipeZone.addEventListener('touchstart', e => {
        startX = e.changedTouches[0].screenX;
        startY = e.changedTouches[0].screenY;
    }, {passive: false});

    swipeZone.addEventListener('touchend', e => {
        if(gameScreen.style.display !== 'flex') return;
        let endX = e.changedTouches[0].screenX;
        let endY = e.changedTouches[0].screenY;
        let diffX = endX - startX;
        let diffY = endY - startY;
        if (Math.abs(diffX) > threshold || Math.abs(diffY) > threshold) {
            if (Math.abs(diffX) > Math.abs(diffY)) {
                if (diffX > 0) handleAnswer('right');
                else handleAnswer('left');
            } else {
                if (diffY > 0) handleAnswer('down');
                else handleAnswer('up');
            }
        }
    });
</script>
